<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time</title>
<link rel="stylesheet" href="style.css">
<link rel="shortcut icon" href="images/logotip" type="image/x-icon">
</head>
<body>
   <header class="time">
    <div class="header_countainer">
        <nav class="header_nav">     
            <img class="image" src="images/time" alt="" width="150" height="50">
      
            <ul class="header_list">
                <li class="header_list-item">
                    <a class="header_list-link active" href="file.html"> Главная Страница</a>
                </li>
            </ul>
            <a class="knock" href="knock.html">Вписать Дату</a>
        </nav>
    </div>
   </header> 
   <main>
    <section class="hero">
        <div class="hero_container">
            <div class="hero_content">
                <div class="hero_text">
                    <h2 class="hero_text-item"> Ближайшее Событие: <span id="main-timer"></span></h2>
                    <P class="hero_text-list"> Основные События:</P>
                    <div id="events"></div>
                </div>    
            </div>
            <img class="hero_images" src="images/chasi" alt="" width="400" height="500">
        </div>
    </section>
   </main>
<!-- 🔥 Firebase подключение -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const eventsContainer = document.getElementById("events");

let events = JSON.parse(localStorage.getItem("events")) || [];

// 🔥 ВЫВОД СОБЫТИЙ
function renderEvents() {
    eventsContainer.innerHTML = "";

    events.forEach((event, index) => {
        const div = document.createElement("div");
        div.className = "event-item";
        
        const text = document.createElement("span");
        text.textContent = event.text;

        // ⏳ таймер справа
        const timer = document.createElement("span");
        timer.className = "timer";

        function updateTimer() {
            const now = new Date();
            const eventDate = new Date(event.date);
            const diff = eventDate - now;

            if (diff <= 0) {
                timer.textContent = "Сейчас 🎉";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);

            timer.textContent = `${days}д ${hours}ч`;
        }

        updateTimer();
        setInterval(updateTimer, 60000);

        // ✏️ изменить
        const editBtn = document.createElement("button");
        editBtn.textContent = "Изменить";

        editBtn.onclick = () => {
    div.innerHTML = "";

    const inputText = document.createElement("input");
    inputText.value = event.text;

    const inputDate = document.createElement("input");
    inputDate.type = "date";
    inputDate.value = event.date.split("T")[0];

    const inputTime = document.createElement("input");
    inputTime.type = "time";
    inputTime.value = event.date.split("T")[1] || "00:00";

    const saveBtn = document.createElement("button");
    saveBtn.textContent = "Сохранить";

    saveBtn.onclick = () => {
        const newText = inputText.value;
        const newDate = inputDate.value;
        const newTime = inputTime.value;

        if (!newText || !newDate) {
            alert("Заполни все поля!");
            return;
        }

        events[index] = {
            text: newText,
            date: `${newDate}T${newTime}`
        };

        localStorage.setItem("events", JSON.stringify(events));
        renderEvents();
    };

    div.appendChild(inputText);
    div.appendChild(inputDate);
    div.appendChild(inputTime);
    div.appendChild(saveBtn);
};

        // ❌ удалить
        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Удалить";

        deleteBtn.onclick = () => {
            events.splice(index, 1);
            localStorage.setItem("events", JSON.stringify(events));
            renderEvents();
        };

        const btnBox = document.createElement("div");
        btnBox.className = "btn-box";

        btnBox.appendChild(editBtn);
        btnBox.appendChild(deleteBtn);

        div.appendChild(text);
        div.appendChild(timer);
        div.appendChild(btnBox);

        eventsContainer.appendChild(div);
    });
}

// 🔥 НАЙТИ БЛИЖАЙШЕЕ
function getClosestEvent(events) {
    const now = new Date();

    let closest = null;
    let minDiff = Infinity;

    events.forEach(event => {
        const diff = new Date(event.date) - now;

        if (diff > 0 && diff < minDiff) {
            minDiff = diff;
            closest = event;
        }
    });

    return closest;
}

// 🔥 ТАЙМЕР СВЕРХУ
function startMainTimer() {
    const timerEl = document.getElementById("main-timer");

    function update() {
        const events = JSON.parse(localStorage.getItem("events")) || [];
        const closest = getClosestEvent(events);

        if (!closest) {
            timerEl.textContent = "Нет событий";
            return;
        }

        const now = new Date();
        const diff = new Date(closest.date) - now;

        if (diff <= 0) {
            timerEl.textContent = "Сейчас 🎉";
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);

        timerEl.textContent = `${closest.text} — ${days}д ${hours}ч ${minutes}м`;
    }

    update();
    setInterval(update, 60000);
}

// 🚀 ЗАПУСК
renderEvents();
startMainTimer();
</script>
</body>
</html>
